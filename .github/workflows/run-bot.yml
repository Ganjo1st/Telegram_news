name: Run News Bot

on:
  schedule:
    - cron: '*/5 * * * *'  # Каждые 5 минут для быстрой публикации
  workflow_dispatch:

jobs:
  run-news-bot:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bots/requirements.txt

      - name: Run News Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TEST_MODE: true
          MIN_POST_INTERVAL: 120  # 2 минуты между постами
          MAX_POST_INTERVAL: 300  # 5 минут
          MAX_POSTS_PER_DAY: 100  # до 100 постов в день
          TIMEZONE_OFFSET: 7
          REQUEST_TIMEOUT: 15
        run: |
          python bots/news_bot.py

      - name: Commit and push state files
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state_news_bot.json posts_meta.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Update state [skip ci]" && git push)
